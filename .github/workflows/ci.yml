name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Docker image build
        run: docker build --no-cache -t wetalks-ci:${{ github.sha }} .

      - name: Pack runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "wetalks-runtime-${GITHUB_SHA}.tar.gz" dist nginx.conf

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: wetalks-runtime-${{ github.sha }}
          path: wetalks-runtime-${{ github.sha }}.tar.gz
          retention-days: 1
          if-no-files-found: error
