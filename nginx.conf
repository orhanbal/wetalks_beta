map $http_authorization $wetalks_authorization {
  default $http_authorization;
  "Bearer wetalks-public-proxy" "";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /auth/v1/ {
    proxy_pass http://supabase-auth-6o8nbzpmuvrkvbruz9hj2kfy:9999/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $wetalks_authorization;
    proxy_set_header apikey "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /rest/v1/ {
    proxy_pass http://supabase-rest-6o8nbzpmuvrkvbruz9hj2kfy:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $wetalks_authorization;
    proxy_set_header apikey "";
    proxy_set_header Accept-Profile wetalks;
    proxy_set_header Content-Profile wetalks;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
